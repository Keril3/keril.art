<script>
// Served for any missing address, so everything here is inline and links are absolute.

(function(){
  var root = document.documentElement;
  var theme = null;
  var language = null;
  try{
    theme = localStorage.getItem('keril-art-theme');
    language = localStorage.getItem('keril-art-language');
  }catch(error){}
  if(theme !== 'light' && theme !== 'dark')theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  if(language !== 'ru' && language !== 'en')language = (navigator.language || 'ru').toLowerCase().startsWith('en') ? 'en' : 'ru';
  root.dataset.theme = theme;
  root.style.colorScheme = theme;
  root.lang = language;
})();
</script>
<style>

.bubble{position:fixed;bottom:-40px;z-index:0;border:1px solid rgba(255,255,255,0.8);border-radius:50%;background:radial-gradient(circle at 32% 26%,#ffffff 0%,#F1FBFF 23%,rgba(184,230,255,0.85) 56%,rgba(116,188,235,0.9) 100%);animation:rise linear infinite;pointer-events:none}

.body{display:flex;flex-direction:column;align-items:center;gap:14px;padding:26px 22px 24px;text-align:center}

<body>
<main class="window" aria-labelledby="error-title">
  <div class="bar">
    <span class="title" id="error-title" data-text="title">ошибка_404.exe</span>
    <a class="close" href="/" data-label="close" aria-label="Закрыть и вернуться на главную" title="Закрыть и вернуться на главную"><svg aria-hidden="true" width="9" height="9" viewBox="0 0 8 8"><line x1="1" y1="1" x2="7" y2="7" stroke="#ffffff" stroke-width="1.4"/><line x1="7" y1="1" x2="1" y2="7" stroke="#ffffff" stroke-width="1.4"/></svg></a>
  </div>
  <div class="body">
    <svg aria-hidden="true" width="74" height="74" viewBox="0 0 100 100"><defs><radialGradient id="sad-bubble" cx="0.34" cy="0.28" r="0.75"><stop offset="0" stop-color="#ffffff"/><stop offset="0.3" stop-color="#F1FBFF"/><stop offset="0.65" stop-color="#B8E6FF"/><stop offset="1" stop-color="#74BCEB"/></radialGradient></defs><circle cx="50" cy="50" r="44" fill="url(#sad-bubble)" stroke="#ffffff" stroke-width="3"/><ellipse cx="35" cy="28" rx="10" ry="5" fill="#ffffff" transform="rotate(-30 35 28)"/><circle cx="38" cy="52" r="4.5" fill="#0B2545"/><circle cx="62" cy="52" r="4.5" fill="#0B2545"/><circle cx="28" cy="62" r="5" fill="#FFC9E8"/><circle cx="72" cy="62" r="5" fill="#FFC9E8"/><path d="M41 70 Q50 62 59 70" fill="none" stroke="#0B2545" stroke-width="3.5" stroke-linecap="round"/><path d="M68 58 q2 5 0 8 q-3 -2 0 -8z" fill="#7FCDFB"/></svg>
    <p class="code">404</p>
    <p class="text" data-text="message">Такой страницы нет — кажется, она уплыла вместе с пузырями.</p>
    <p class="path" id="error-path"></p>
    <a class="home" href="/" data-text="home">← На главную</a>
  </div>
</main>
<script>
const copy = {
  ru:{title:'ошибка_404.exe',message:'Такой страницы нет — кажется, она уплыла вместе с пузырями.',home:'← На главную',close:'Закрыть и вернуться на главную',notFound:'не найден'},
  en:{title:'error_404.exe',message:'This page does not exist — it seems to have floated away with the bubbles.',home:'← Back to home',close:'Close and go back home',notFound:'not found'}
}[document.documentElement.lang];
document.querySelectorAll('[data-text]').forEach(element=>{element.textContent = copy[element.dataset.text]});
document.querySelectorAll('[data-label]').forEach(element=>{
  element.setAttribute('aria-label',copy[element.dataset.label]);
  element.title = copy[element.dataset.label];
});
// The missing address is shown as a path in the site's C:\ style; textContent keeps it inert.
let path = location.pathname;
try{path = decodeURIComponent(path)}catch(error){}
path = path.replace(/^\/+/,'').replace(/\//g,'\\');
if(path.length > 60)path = path.slice(0,57) + '...';
document.querySelector('#error-path').textContent = `C:\\keril.art\\${path} — ${copy.notFound}`;
// A few slow bubbles drift up behind the window.
for(let index = 0;index < 12;index++){
  const bubble = document.createElement('span');
  const size = 6 + Math.random() * 26;
  bubble.className = 'bubble';
  bubble.style.left = `${Math.random() * 100}%`;
  bubble.style.width = `${size}px`;
  bubble.style.height = `${size}px`;
  bubble.style.opacity = (0.5 + Math.random() * 0.4).toFixed(2);
  bubble.style.setProperty('--drift',`${(Math.random() - 0.5) * 120}px`);
  bubble.style.animationDuration = `${14 + Math.random() * 16}s`;
  bubble.style.animationDelay = `${-Math.random() * 30}s`;
  document.body.append(bubble);
}
</script>
</body>
