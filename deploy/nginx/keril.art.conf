# REFERENCE ONLY: an example nginx config for keril.art on the owner's VPS.
# The live server is maintained by the owner; compare with the running config
# before changing anything there, and never touch ports 80/443, Xray or 3x-ui.
#
# How traffic arrives:
#   - port 80: nginx (HTTP, certbot webroot challenge, redirect to HTTPS);
#   - port 443: Xray Reality. Its dest is 127.0.0.1:8444 with SNI keril.art and
#     www.keril.art, so normal visitors reach the HTTPS block below through Xray.
# Because of that, every HTTPS request comes from 127.0.0.1. Per-IP limits
# (limit_req/limit_conn by $binary_remote_addr) would throttle all visitors at
# once, so there are none here; counter.php only has an overall ceiling.

# One shared ceiling for the counter endpoint, so a flood cannot tie up PHP-FPM.
limit_req_zone $server_name zone=keril_counter_total:1m rate=20r/s;
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name keril.art www.keril.art;
    server_tokens off;

    # certbot (webroot mode) answers its HTTP challenge here; everything else moves to HTTPS.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/keril.art;
    }
    location / {
        return 301 https://keril.art$request_uri;
    }
}

server {
    listen 127.0.0.1:8444 ssl http2;
    server_name keril.art www.keril.art;
    server_tokens off;

    root /var/www/keril.art;
    index index.html;
    # Missing addresses get the site's own 404 page (with a real 404 status).
    error_page 404 /404.html;

    ssl_certificate /etc/letsencrypt/live/keril.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/keril.art/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 1k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; font-src https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self' https://api.github.com https://api.mymemory.translated.net; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors 'none'" always;

    if ($request_method !~ ^(GET|HEAD|POST)$) {
        return 405;
    }

    # The only executable script. It refuses writes that do not come from the page itself.
    location = /counter.php {
        limit_req zone=keril_counter_total burst=40 nodelay;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;
    }

    # Nothing else may run as PHP, and hidden files (.git, .env, ...) are never served,
    # except .well-known, which certificate renewal needs.
    location ~ \.php$ {
        return 404;
    }
    location ~ /\.(?!well-known/) {
        return 404;
    }

    location / {
        limit_except GET HEAD {
            deny all;
        }
        try_files $uri $uri/ =404;
    }
}
