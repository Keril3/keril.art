# nginx site config for keril.art: /etc/nginx/sites-available/keril.art
# Replace php8.4-fpm.sock with the socket shown by `ls /run/php/`.
# certbot adds the ssl_certificate lines to the HTTPS server block.

# Per-IP rate limits. Pages are generous; the counter allows a few requests per page load.
limit_req_zone $binary_remote_addr zone=keril_pages:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=keril_counter:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=keril_connections:10m;
limit_req_status 429;
limit_conn_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name keril.art www.keril.art;
    server_tokens off;

    # certbot answers its HTTP challenge here; everything else moves to HTTPS.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/keril.art;
    }
    location / {
        return 301 https://keril.art$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name keril.art www.keril.art;
    server_tokens off;

    root /var/www/keril.art;
    index index.html;

    client_max_body_size 1k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    limit_conn keril_connections 20;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors 'none'" always;

    if ($request_method !~ ^(GET|HEAD|POST)$) {
        return 405;
    }

    # The only executable script. It refuses writes that do not come from the page itself.
    location = /counter.php {
        limit_req zone=keril_counter burst=10 nodelay;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    # Nothing else may run as PHP, and hidden files (.git, .env, ...) are never served,
    # except .well-known, which certificate renewal needs.
    location ~ \.php$ {
        return 404;
    }
    location ~ /\.(?!well-known/) {
        return 404;
    }

    location / {
        limit_req zone=keril_pages burst=40 nodelay;
        limit_except GET HEAD {
            deny all;
        }
        try_files $uri $uri/ =404;
    }
}
