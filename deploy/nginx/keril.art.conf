# REFERENCE ONLY: how the keril.art server block looks on the live server (as of 13.11.2026).
# The live config is /etc/nginx/sites-available/keril.art on 94.242.59.197 (Ubuntu 26.04, nginx 1.28,
# PHP 8.5). The owner keeps it, together with the Claude that administers the server (/etc is tracked
# with etckeeper); the up-to-date description is E:\PersonalServer\SITE-SERVER-NOTES.md on the owner's
# PC. Zone names and the exact extension list below are illustrative. Never touch the port 80 redirects,
# the www redirect, the "return 444" catch-all or the vpn.keril.art blocks, nor Xray / 3x-ui.
#
# How traffic arrives:
#   - port 80: Let's Encrypt (certbot --webroot -w /var/www/keril.art) and a redirect to https://keril.art;
#   - port 443: Xray Reality. Its dest is 127.0.0.1:8444 with SNI keril.art / www.keril.art, and it passes
#     the visitor's real address in a PROXY protocol header, so nginx restores it and per-IP limits work.
#     nginx drops connections without that header; to test it directly:
#       curl -skI --haproxy-protocol --resolve keril.art:8444:127.0.0.1 https://keril.art:8444/

# Per-visitor ceiling for the counter: 30 requests a minute from one address, bursts up to 20.
limit_req_zone $binary_remote_addr zone=keril_counter:10m rate=30r/m;
limit_req_status 429;

server {
    listen 127.0.0.1:8444 ssl proxy_protocol;
    http2 on;
    server_name keril.art;
    server_tokens off;

    # The visitor's address comes from Xray's PROXY header.
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    root /var/www/keril.art;
    index index.html;
    # Missing addresses get the site's own 404 page (with a real 404 status).
    error_page 404 /404.html;

    ssl_certificate /etc/letsencrypt/live/keril.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/keril.art/privkey.pem;
    # TLS 1.2 and 1.3 with the Mozilla "intermediate" ciphers (1.2 keeps older devices working).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    client_max_body_size 1k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # HSTS, CSP, X-Frame-Options and the rest, all with "always". As seen from outside, the snippet
    # snippets/keril-security-headers.conf sends:
    #   Strict-Transport-Security "max-age=31536000"
    #   X-Content-Type-Options "nosniff"
    #   X-Frame-Options "DENY"
    #   Referrer-Policy "strict-origin-when-cross-origin"
    #   Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    #   Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests"
    # The full page policy (script-src, connect-src, font-src ...) is the <meta> CSP in index.html and
    # 404.html; the browser applies both.
    include snippets/keril-security-headers.conf;
    # Cross-Origin-Opener-Policy "same-origin", kept in its own snippet for this site only.
    include snippets/keril-coop.conf;

    if ($request_method !~ ^(GET|HEAD|POST)$) {
        return 405;
    }

    # The only script. It refuses writes that do not come from the page itself (see counter.php).
    location = /counter.php {
        limit_req zone=keril_counter burst=20 nodelay;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
    }

    # Pages, including / (index.html) and the 404 page: checked again on every visit (ETag, 304), so a
    # new version shows at once. A location with its own add_header stops inheriting the server-level
    # add_header lines, so the security snippet is included here again; without it HSTS and CSP vanish.
    location ~ \.html$ {
        add_header Cache-Control "no-cache" always;
        include snippets/keril-security-headers.conf;
        include snippets/keril-coop.conf;
    }

    # The link-preview picture is checked again too, so a replaced picture reaches messengers sooner.
    # expires does not touch the inherited add_header lines.
    location = /og-image.jpg {
        expires epoch;
    }

    # Fonts, icons and other static files: 7 days. A replaced picture is best given a new file name.
    location ~* \.(?:css|js|png|jpe?g|gif|svg|ico|webp|woff2?|ttf)$ {
        expires 7d;
    }

    # Nothing else may run as PHP, and hidden files (.git, .env, ...) are never served,
    # except .well-known, which certificate renewal needs.
    location ~ \.php$ {
        return 404;
    }
    location ~ /\.(?!well-known/) {
        return 404;
    }

    location / {
        limit_except GET HEAD {
            deny all;
        }
        try_files $uri $uri/ =404;
    }
}
